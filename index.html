<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body { 
    background: url('i.webp') no-repeat center center fixed; 
    background-size: cover; 
    background-color: #1a0033; /* Запасной темно-фиолетовый цвет */
    color: #ffffff; 
    min-height: 100vh; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
}

        .navbar {
            margin-top: 30px; width: 90%; max-width: 900px;
            background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px;
            display: flex; justify-content: space-between; align-items: center; padding: 12px 25px;
        }

        .nav-logo { font-weight: 700; font-size: 1.1rem; display: flex; align-items: center; gap: 10px; }
        .nav-logo-icon { color: #5a9cff; font-size: 1.3rem; font-style: italic; font-family: serif; }

        .nav-links { display: flex; gap: 25px; font-size: 0.85rem; color: rgba(255, 255, 255, 0.7); }
        .nav-links a { color: inherit; text-decoration: none; display: flex; align-items: center; gap: 6px; }
        
        .nav-auth { display: flex; gap: 10px; }
        .nav-auth button { 
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff; cursor: pointer; font-size: 0.85rem; padding: 8px 16px; border-radius: 12px;
        }

        .hero { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; margin-top: -50px; }
        .hero-logo-big { font-size: 4rem; color: #5a9cff; margin-bottom: 25px; font-style: italic; font-family: serif; }
        .hero h1 { font-size: 3.2rem; margin-bottom: 20px; }
        
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: rgba(20, 25, 35, 0.95); padding: 35px; border-radius: 16px; width: 380px; position: relative;
        }
        .close-btn { position: absolute; top: 15px; right: 20px; background: none; border: none; color: #888; font-size: 1.5rem; cursor: pointer; }
        .modal-content h2 { text-align: center; margin-bottom: 25px; font-weight: 500; font-size: 1.5rem; }
        
        .input-group { margin-bottom: 15px; position: relative; }
        .input-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #888; }
        .modal-content input { 
            width: 100%; padding: 14px 15px 14px 45px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 10px;
        }
        
        .action-btn { 
            width: 100%; padding: 14px; margin-top: 10px; background: #5a9cff; border: none; border-radius: 10px; color: #fff; font-weight: 600; cursor: pointer; 
        }
        
        .info-row { display: flex; justify-content: space-between; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 0.9rem; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-logo"><span class="nav-logo-icon">S</span> Horus</div>
        
        <div class="nav-links">
            <a href="#"><i class="fa-solid fa-wand-magic-sparkles"></i> Advantages</a>
            <a href="#"><i class="fa-solid fa-box-open"></i> Products</a>
        </div>
        
        <div class="nav-auth" id="guest-buttons">
            <button onclick="openModal('login-modal')">Login</button>
            <button onclick="openModal('register-modal')">Register</button>
        </div>
        
        <div class="nav-auth hidden" id="user-buttons">
            <button onclick="openModal('profile-modal')" style="background: rgba(90, 156, 255, 0.2);">Мой профиль</button>
        </div>
    </nav>

    <main class="hero">
        <div class="hero-logo-big">S</div>
        <h1>Открой новые возможности</h1>
    </main>

    <div id="login-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModals()">✕</button>
            <h2>Вход</h2>
            <div class="input-group"><i class="fa-solid fa-envelope"></i><input type="email" id="login-email" placeholder="Email"></div>
            <div class="input-group"><i class="fa-solid fa-lock"></i><input type="password" id="login-password" placeholder="Пароль"></div>
            <button class="action-btn" onclick="login()">Войти</button>
        </div>
    </div>

    <div id="register-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModals()">✕</button>
            <h2>Регистрация</h2>
            <div class="input-group"><i class="fa-solid fa-user"></i><input type="text" id="reg-nickname" placeholder="Никнейм"></div>
            <div class="input-group"><i class="fa-solid fa-envelope"></i><input type="email" id="reg-email" placeholder="Email"></div>
            <div class="input-group"><i class="fa-solid fa-lock"></i><input type="password" id="reg-password" placeholder="Пароль"></div>
            <button class="action-btn" onclick="register()">Создать</button>
        </div>
    </div>

    <div id="profile-modal" class="modal-overlay">
        <div class="modal-content" style="width: 420px;">
            <button class="close-btn" onclick="closeModals()">✕</button>
            <h2>Мой профиль</h2>
            
            <div class="info-row"><span style="color: #aaa;">Ник:</span> <strong id="prof-nickname"></strong></div>
            <div class="info-row"><span style="color: #aaa;">Email:</span> <strong id="prof-email"></strong></div>
            <div class="info-row"><span style="color: #aaa;">HWID:</span> <strong id="prof-hwid"></strong></div>
            <div class="info-row"><span style="color: #aaa;">Подписка:</span> <strong id="prof-sub"></strong></div>
            
            <button class="action-btn" style="background: rgba(255, 60, 60, 0.15); color: #ff5555; margin-top: 25px;" onclick="logout()">Выйти</button>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://cltpudntuxyyppmvelhu.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsdHB1ZG50dXh5eXBwbXZlbGh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2MTM5MDQsImV4cCI6MjEwNDE4OTkwNH0.3V1iJ__rXqq0CNJ7_fqtqdMruHc0Bblel1FMCoqTY2k';
        
        let supabase;
        try {
            supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
            console.log("Supabase подключен успешно");
        } catch(e) {
            console.error("Ошибка подключения Supabase:", e);
        }

        function openModal(id) {
            closeModals();
            document.getElementById(id).style.display = 'flex';
        }
        function closeModals() {
            document.querySelectorAll('.modal-overlay').forEach(el => el.style.display = 'none');
        }

        window.onload = async () => {
            if(!supabase) return;
            const { data: { session } } = await supabase.auth.getSession();
            if (session) loadProfile(session.user.id);
        };

        async function register() {
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const nickname = document.getElementById('reg-nickname').value;

            if (!nickname) return alert("Введите никнейм!");

            const { data, error } = await supabase.auth.signUp({ email, password });
            if (error) return alert(error.message);

            const { error: profileError } = await supabase.from('profiles').insert([{ id: data.user.id, email: email, nickname: nickname }]);
            if (profileError) alert("Ошибка профиля: " + profileError.message);
            else { alert("Успешно!"); loadProfile(data.user.id); }
        }

        async function login() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) alert(error.message);
            else loadProfile(data.user.id);
        }

        async function logout() {
            await supabase.auth.signOut();
            document.getElementById('guest-buttons').classList.remove('hidden');
            document.getElementById('user-buttons').classList.add('hidden');
            closeModals();
        }

        async function loadProfile(userId) {
            const { data, error } = await supabase.from('profiles').select('*').eq('id', userId).single();
            if (error) return console.error(error);

            document.getElementById('prof-nickname').innerText = data.nickname;
            document.getElementById('prof-email').innerText = data.email;
            document.getElementById('prof-hwid').innerText = data.hwid ? "Привязан" : "Не привязан";
            document.getElementById('prof-sub').innerText = data.sub_expires_at ? new Date(data.sub_expires_at).toLocaleDateString() : "Нет";

            document.getElementById('guest-buttons').classList.add('hidden');
            document.getElementById('user-buttons').classList.remove('hidden');
            closeModals();
        }
    </script>
</body>
</html>
