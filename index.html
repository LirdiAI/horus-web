<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Базовые настройки */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body { 
            /* Фон из Minecraft с затемнением */
            background: linear-gradient(rgba(15, 20, 30, 0.4), rgba(10, 15, 25, 0.8)), url('https://images.unsplash.com/photo-1607513746994-51f730a44832?q=80&w=2000&auto=format&fit=crop') no-repeat center center fixed; 
            background-size: cover; 
            color: #ffffff; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }

        /* Плавающее меню навигации */
        .navbar {
            margin-top: 30px;
            width: 90%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.08); /* Полупрозрачный фон */
            backdrop-filter: blur(12px); /* Эффект размытия (стекло) */
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px; /* Скругление как на макете */
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        /* Логотип */
        .nav-logo { 
            font-weight: 700; 
            font-size: 1.1rem; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            color: #fff;
        }
        /* Синий значок логотипа */
        .nav-logo-icon { 
            color: #5a9cff; 
            font-size: 1.3rem; 
            font-style: italic;
            font-family: serif;
        }

        /* Центральные ссылки меню */
        .nav-links { 
            display: flex; 
            gap: 25px; 
            font-size: 0.85rem; 
            color: rgba(255, 255, 255, 0.7); 
        }
        .nav-links a { 
            color: inherit; 
            text-decoration: none; 
            transition: color 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .nav-links a:hover { color: #fff; }
        .nav-links i { font-size: 0.8rem; }

        /* Кнопки входа и регистрации */
        .nav-auth { display: flex; gap: 10px; }
        .nav-auth button { 
            background: rgba(255, 255, 255, 0.1); 
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff; 
            cursor: pointer; 
            font-size: 0.85rem; 
            padding: 8px 16px;
            border-radius: 12px;
            transition: all 0.2s ease; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }
        .nav-auth button:hover { 
            background: rgba(255, 255, 255, 0.2); 
        }

        /* Центральный контент (Hero) */
        .hero {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            max-width: 800px;
            padding: 20px;
            margin-top: -50px; /* Компенсация высоты меню */
        }
        
        /* Большой логотип в центре */
        .hero-logo-big { 
            font-size: 4rem; 
            color: #5a9cff; 
            margin-bottom: 25px; 
            font-style: italic;
            font-family: serif;
            text-shadow: 0 0 20px rgba(90, 156, 255, 0.5);
        }
        
        .hero h1 { 
            font-size: 3.2rem; 
            margin-bottom: 20px; 
            font-weight: 600; 
            letter-spacing: -0.5px;
        }
        
        .hero p { 
            font-size: 1.05rem; 
            color: rgba(255, 255, 255, 0.8); 
            line-height: 1.6; 
            max-width: 600px;
        }

        /* Стрелка вниз */
        .scroll-down {
            margin-top: 50px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 1.2rem;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        /* Всплывающие окна (Модалки) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items
